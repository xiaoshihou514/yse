[package]
name = "gansi"
version = "0.1.0"
edition = "2024"
description = "Developer toolchain for Yse: gansi create/run/test/build"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8.23"

[[bin]]
name = "gansi"
path = "src/main.rs"
