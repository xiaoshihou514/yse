[package]
name = "gansi"
version = "0.1.0"
edition = "2024"
description = "Developer toolchain for Yse: gansi create/run/test/build"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
dirs = "6.0.0"
flate2 = "1.0.35"
reqwest = { version = "0.12.12", default-features = false, features = ["blocking", "rustls-tls"] }
tar = "0.4.42"
serde = { version = "1.0.229", features = ["derive"] }
zip = "2.2.3"
toml = "0.8.23"
xz2 = "0.1.7"
bzip2 = "0.4.4"
sha1 = "0.10.6"
roxmltree = "0.21.1"
sevenz-rust2 = "0.20.2"

[[bin]]
name = "gansi"
path = "src/main.rs"
